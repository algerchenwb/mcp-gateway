name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Validate configuration examples
        env:
          BUSINESS_BACKEND_AUTHORIZATION: "Bearer example-only"
        run: |
          cargo run -p mcp-gateway-server --locked -- validate-config -c config/gateway.toml
          cargo run -p mcp-gateway-server --locked -- validate-config -c config/oauth.example.toml
